name: Build APK

on:
  push:
    branches: [ main, GTA-2.10 ]
  pull_request:
    branches: [ main, GTA-2.10 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: GTA-2.10

      - name: Verify gradlew exists
        run: |
          ls -la
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found at repo root - check project structure"
            exit 1
          fi

      - name: Remove dead splunk repository
        run: |
          find . -name "build.gradle" -exec sed -i '/splunk/Id' {} \;

      - name: Fix PRDownloader version to valid release
        run: |
          find . -name "build.gradle" -exec sed -i 's/PRDownloader:1\.0\.1/PRDownloader:1.0.2/g' {} \;

      - name: Ensure JitPack repository is present in settings.gradle
        run: |
          if [ -f "settings.gradle" ]; then
            grep -q "jitpack.io" settings.gradle || sed -i "/dependencyResolutionManagement/,/}/ s#google()#google()\n        maven { url 'https://jitpack.io' }#" settings.gradle
          fi
          cat settings.gradle || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
