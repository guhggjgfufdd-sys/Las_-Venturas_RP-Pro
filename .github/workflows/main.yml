name: Build APK

on:
  push:
    branches: [ main, GTA-2.10 ]
  pull_request:
    branches: [ main, GTA-2.10 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: GTA-2.10

      - name: Verify gradlew exists
        run: |
          ls -la
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found at repo root - check project structure"
            exit 1
          fi

      - name: Remove dead splunk repository
        run: |
          find . -name "build.gradle" -exec sed -i '/splunk/Id' {} \;

      - name: Add JitPack repository globally
        run: |
          cat > init.gradle << 'EOF'
          allprojects {
              repositories {
                  maven { url 'https://jitpack.io' }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace -I init.gradle

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
